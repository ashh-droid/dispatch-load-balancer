spring:
  application:
    name: dispatch-load-balancer
  datasource:
    url: jdbc:h2:mem:dispatch;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  sql:
    init:
      mode: always
server:
  port: ${PORT:8080}
  # Honor trusted reverse-proxy scheme/host when the API is served over HTTPS.
  forward-headers-strategy: native
management:
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Opt-in sample seeding for ephemeral demonstration deployments (disabled locally).
app:
  seed-sample-data: ${SEED_SAMPLE_DATA:false}
  delete-endpoints-enabled: ${DELETE_ENDPOINTS_ENABLED:true}
